[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fred-economic-chat"
version = "0.1.0"
description = "Evidence-grounded conversational analysis of FRED GDP and Core CPI"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.51.0",
  "pandas==2.3.3",
  "plotly==6.3.1",
  "pydantic==2.12.4",
  "httpx==0.28.1",
  "python-dotenv==1.2.1",
  "kaleido==0.2.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly enabled external-service smoke tests"]
